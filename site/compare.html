<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APIShelf — Compare</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>" />
  <style>
    .compare-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    .compare-table th { background: var(--bg-elev); position: sticky; top: 0; }
    .compare-table th, .compare-table td { padding: .55rem .75rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    .compare-table th:first-child, .compare-table td:first-child { color: var(--fg-muted); font-weight: 500; width: 160px; }
    .yes { color: var(--success); font-weight: 600; }
    .no { color: var(--danger); font-weight: 600; }
    .tip-row {
      display: flex; gap: .4rem; align-items: flex-start;
      padding: .3rem .5rem; border-radius: var(--radius-sm);
      font-size: .82rem; line-height: 1.4;
      border-left: 2px solid var(--border);
      margin-bottom: .3rem;
    }
    .tip-row.tip-info { background: var(--info-bg); border-left-color: var(--accent); }
    .tip-row.tip-warning { background: var(--warning-bg); border-left-color: var(--warning); }
    .tip-row .tip-icon { flex-shrink: 0; }
    .picker { display: flex; flex-wrap: wrap; gap: .35rem; margin: 1rem 0; }
    .picker .chip { cursor: pointer; }
    .picker .chip[data-active="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  </style>
</head>
<body>
  <header class="site-header"><div class="row">
    <a href="./" class="brand"><span aria-hidden="true">📚</span><strong>APIShelf</strong></a>
    <nav class="primary-nav"><a href="./">Directory</a><a href="./status.html">Status</a><a href="./compare.html" aria-current="page">Compare</a><a href="./submit.html">Submit</a></nav>
  </div></header>

  <main class="row" style="padding-block: 2rem;">
    <h1>Compare APIs</h1>
    <p style="color: var(--fg-muted);">Pick 2–4 APIs to see them side-by-side. Filter by category to narrow the picker.</p>

    <label>
      Category:
      <select id="cat-select" style="background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px; padding: .35rem .55rem; color: var(--fg);">
        <option value="">All</option>
      </select>
    </label>

    <div class="picker" id="picker"></div>

    <div id="compare-out"></div>
  </main>

  <script type="module">
    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    // Canonical gotcha normalizer — same body in site/app.js and scripts/generate-readme.js.
    const normalizeGotcha = (g) => typeof g === 'string'
      ? { severity: 'info', text: g }
      : { severity: g.severity || 'info', text: g.text };
    document.documentElement.dataset.theme = localStorage.getItem('apishelf:theme') || 'dark';

    const [data, catData] = await Promise.all([
      fetch('../data/apis.json').then(r => r.json()),
      fetch('../data/categories.json').then(r => r.json()),
    ]);

    const params = new URL(location.href).searchParams;
    const initialIds = (params.get('ids') || '').split(',').filter(Boolean);
    const selected = new Set(initialIds);
    const categorySelect = document.getElementById('cat-select');
    catData.categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      categorySelect.appendChild(opt);
    });
    let activeCat = '';
    categorySelect.addEventListener('change', e => { activeCat = e.target.value; renderPicker(); });

    function renderPicker() {
      const list = data.apis.filter(a => !activeCat || a.category === activeCat);
      document.getElementById('picker').innerHTML = list.map(a =>
        `<button class="chip" data-id="${a.id}" data-active="${selected.has(a.id)}" type="button">${escapeHtml(a.name)}</button>`
      ).join('');
      document.querySelectorAll('#picker .chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          if (selected.has(id)) selected.delete(id);
          else if (selected.size < 4) selected.add(id);
          else { alert('Maximum 4 APIs at once.'); return; }
          renderPicker(); renderCompare();
        });
      });
    }

    function renderCompare() {
      const items = [...selected].map(id => data.apis.find(a => a.id === id)).filter(Boolean);
      if (items.length < 2) {
        document.getElementById('compare-out').innerHTML = '<p style="color: var(--fg-muted); padding: 1rem 0;">Select at least 2 APIs to compare.</p>';
        return;
      }
      const yn = (b) => b ? '<span class="yes">✓ yes</span>' : '<span class="no">✗ no</span>';
      const rows = [
        ['Verified', items.map(a => a._meta?.verified ? `<span class="yes">✅ ${a._meta.last_verified}</span>` : '<span class="no">🔐 docs-only</span>')],
        ['Auth', items.map(a => a.auth_type.replace('_', ' '))],
        ['Pricing tier', items.map(a => a.pricing_tier.replace(/_/g, ' '))],
        ['Requires CC', items.map(a => yn(!a.requires_credit_card).replace('yes', 'no').replace('no', a.requires_credit_card ? 'YES — required' : 'no').replace('✗ no', a.requires_credit_card ? '<span class="no">✗ required</span>' : '<span class="yes">✓ no</span>'))],
        ['HTTPS', items.map(a => yn(a.https))],
        ['CORS', items.map(a => yn(a.cors))],
        ['Rate / minute', items.map(a => a.rate_limits?.per_minute ?? '—')],
        ['Rate / day', items.map(a => a.rate_limits?.per_day?.toLocaleString() ?? '—')],
        ['Rate / month', items.map(a => a.rate_limits?.per_month?.toLocaleString() ?? '—')],
        ['Rate notes', items.map(a => escapeHtml(a.rate_limits?.notes || '—'))],
        ['Heads up', items.map(a => {
          const tips = (a.gotchas || []).map(normalizeGotcha);
          if (!tips.length) return '<span style="color: var(--fg-muted);">none reported</span>';
          // sort warnings first
          tips.sort((x, y) => (x.severity === 'warning' ? -1 : 0) - (y.severity === 'warning' ? -1 : 0));
          return tips.map(g => {
            const icon = g.severity === 'warning' ? '⚠️' : 'ℹ️';
            const label = g.severity === 'warning' ? 'Warning' : 'Note';
            return `<div class="tip-row tip-${g.severity}"><span class="tip-icon" title="${label}">${icon}</span><span>${escapeHtml(g.text)}</span></div>`;
          }).join('');
        })],
        ['Docs', items.map(a => `<a href="${a.docs_url}" target="_blank" rel="noopener">${escapeHtml(a.docs_url.replace(/^https?:\\/\\//, ''))}</a>`)],
      ];
      const head = '<tr><th></th>' + items.map(a => `<th><a href="./#${a.id}">${escapeHtml(a.name)}</a></th>`).join('') + '</tr>';
      const body = rows.map(([label, vals]) => `<tr><td>${label}</td>${vals.map(v => `<td>${v}</td>`).join('')}</tr>`).join('');
      document.getElementById('compare-out').innerHTML = `<table class="compare-table">${head}${body}</table>`;
    }
    renderPicker(); renderCompare();
  </script>
</body>
</html>
