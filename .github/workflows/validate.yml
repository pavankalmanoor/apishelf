name: Validate

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Validate apis.json against schema
        run: npm run validate
